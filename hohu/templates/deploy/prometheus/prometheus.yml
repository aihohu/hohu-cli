global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/ai-tool-gateway.yml

scrape_configs:
  - job_name: hohu-admin-api
    metrics_path: /metrics
    static_configs:
      - targets: ['hohu-admin-api:8000']
        labels:
          service: hohu-admin-api
