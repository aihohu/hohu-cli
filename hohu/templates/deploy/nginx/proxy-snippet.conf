# hohu-admin reverse proxy snippet
# Usage: include this file in your nginx server block
#
# Prerequisites:
#   1. Set ENABLE_NGINX=false in .env
#   2. Set WEB_PORT=127.0.0.1:8080 and API_PORT=127.0.0.1:8000 in .env
#   3. Include this snippet in your own nginx config:
#      server { ... include /path/to/proxy-snippet.conf; }
#
# Rate limiting zones (add to your http block):
#   limit_req_zone $binary_remote_addr zone=hohu_general:10m rate=100r/s;
#   limit_req_zone $binary_remote_addr zone=hohu_auth:10m rate=10r/m;

# API (Swagger docs at /docs)
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Auth endpoints rate limit
location /auth/ {
    limit_req zone=hohu_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Uploaded files (served by backend)
location /uploads/ {
    limit_req zone=hohu_general burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# General proxy to frontend
location / {
    limit_req zone=hohu_general burst=20 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}
