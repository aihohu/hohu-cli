name: hohu

services:
  # ============================
  # Infrastructure
  # ============================
  postgres:
    image: postgres:18-alpine
    container_name: hohu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hohu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hohu_secret_6789}
      POSTGRES_DB: ${POSTGRES_DB:-hohu_admin}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hohu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hohu-network

  redis:
    image: redis:8.6-alpine
    container_name: hohu-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-hohu_redis_6789}
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hohu_redis_6789}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hohu-network

  # ============================
  # Database Migration (run once)
  # ============================
  db-migrator:
    image: ${API_IMAGE:-ghcr.io/aihohu/hohu-admin}:${IMAGE_TAG:-latest}
    container_name: hohu-db-migrator
    env_file: .env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hohu}:${POSTGRES_PASSWORD:-hohu_secret_6789}@postgres:5432/${POSTGRES_DB:-hohu_admin}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Running database migrations..."
        alembic upgrade head
        if [ "$$RUN_INIT" = "1" ]; then
          echo "Initializing database..."
          python scripts/init_db.py
        fi
        echo "Syncing menus..."
        python scripts/sync_menus.py
        echo "Seeding system configs..."
        python scripts/seed_config.py
        echo "Done."
    profiles:
      - migrate
    networks:
      - hohu-network

  # ============================
  # Application
  # ============================
  hohu-admin-api:
    image: ${API_IMAGE:-ghcr.io/aihohu/hohu-admin}:${IMAGE_TAG:-latest}
    container_name: hohu-admin-api
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: prod
      # 仅承担 FastAPI，调度器由独立的 hohu-admin-scheduler 服务运行
      APP_ROLE: api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hohu}:${POSTGRES_PASSWORD:-hohu_secret_6789}@postgres:5432/${POSTGRES_DB:-hohu_admin}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hohu_redis_6789}
      REDIS_DB: 0
      WORKER_ID: ${WORKER_ID:-1}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      SERVER_URL: ${SERVER_URL:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - hohu-network

  # ============================
  # Scheduler (APScheduler 独立进程)
  # ============================
  # 将定时任务调度与 web 进程隔离，避免多 worker 重复触发
  # 通过 Redis pub/sub 接收 web 进程发来的配置变更和手动触发事件
  hohu-admin-scheduler:
    image: ${API_IMAGE:-ghcr.io/aihohu/hohu-admin}:${IMAGE_TAG:-latest}
    container_name: hohu-admin-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler_worker"]
    env_file: .env
    environment:
      ENV: prod
      APP_ROLE: scheduler
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hohu}:${POSTGRES_PASSWORD:-hohu_secret_6789}@postgres:5432/${POSTGRES_DB:-hohu_admin}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hohu_redis_6789}
      REDIS_DB: 0
      WORKER_ID: ${WORKER_ID:-1}
      SERVER_URL: ${SERVER_URL:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - hohu-network

  hohu-admin-web:
    image: ${WEB_IMAGE:-ghcr.io/aihohu/hohu-admin-web}:${IMAGE_TAG:-latest}
    container_name: hohu-admin-web
    restart: unless-stopped
    environment:
      API_URL: http://hohu-admin-api:8000/
    depends_on:
      hohu-admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - hohu-network

  # ============================
  # Nginx Reverse Proxy
  # ============================
  # 默认 HTTP 模式，设置 ENABLE_SSL=true 启用 HTTPS
  # 如使用自己的 nginx，可注释掉此服务，参考 nginx/proxy-snippet.conf
  nginx:
    image: nginx:alpine
    container_name: hohu-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      ENABLE_SSL: ${ENABLE_SSL:-false}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/custom/nginx.conf:ro
      - ./nginx/nginx-ssl.conf:/etc/nginx/custom/nginx-ssl.conf:ro
      - ./nginx/entrypoint.sh:/etc/nginx/custom/entrypoint.sh:ro
      - ${SSL_CERT_PATH:-./ssl}:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    entrypoint: ["sh", "/etc/nginx/custom/entrypoint.sh"]
    depends_on:
      hohu-admin-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hohu-network

  # ============================
  # Certbot (Let's Encrypt)
  # ============================
  # 可选服务，用于自动申请和续期 SSL 证书
  # 启用方式: docker compose run --rm certbot certonly
  certbot:
    image: certbot/certbot
    container_name: hohu-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - certbot
    networks:
      - hohu-network

# ============================
# Volumes
# ============================
volumes:
  pgdata:
    name: hohu-pgdata
  redisdata:
    name: hohu-redisdata
  certbot-www:
    name: hohu-certbot-www
  certbot-conf:
    name: hohu-certbot-conf

# ============================
# Network
# ============================
networks:
  hohu-network:
    name: hohu-network
    driver: bridge
