name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check . --output-format=github

      - name: Check Formatting
        run: uv run ruff format --check .

      - name: Test CLI repository sources and Skills installer boundary
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.local/reports/.coverage
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mkdir -p .local/tests .local/reports
          uv run --with coverage==7.16.2 coverage run --branch --source=hohu.commands.skills,hohu.commands.admin.create,hohu.utils.repository -m pytest --basetemp "$PWD/.local/tests/pytest" -o cache_dir="$PWD/.local/cache/pytest"
          uv run --with coverage==7.16.2 coverage report --fail-under=70
